<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | CampusCode</title>
  <link rel="icon" href="/img/campuscode-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="glow glow-purple"></div>
  <div class="glow glow-lime"></div>

  <main class="page auth">

    <section class="auth-left">
      <p class="mono-label"><span class="dot"></span> CampusCode / Registration</p>
      <h1 class="auth-title">JOIN<br>THE<br><span class="outline-text">ARENA.</span></h1>
      <p class="auth-sub">Create your CampusCode identity and become part of a student network built to learn, build and compete.</p>

      <div class="mini-cards">
        <div class="mini-card"><span class="mono-label">01</span><strong>CREATE</strong></div>
        <div class="mini-card"><span class="mono-label">02</span><strong>COLLABORATE</strong></div>
        <div class="mini-card"><span class="mono-label">03</span><strong>COMPETE</strong></div>
      </div>
    </section>

    <section class="auth-right">
      <div class="auth-card">
        <p class="mono-label">New account</p>
        <h2 class="card-title">REGISTER</h2>
        <p class="card-sub">Create your CampusCode account.</p>
        <hr class="card-line">

        <form id="register-form" novalidate>
          <label class="field-label" for="name">Full name</label>
          <input class="field" type="text" id="name" placeholder="Your full name">

          <label class="field-label" for="reg-email">Email address</label>
          <input class="field" type="email" id="reg-email" placeholder="you@example.com">

          <label class="field-label">Role</label>
          <div class="role-row">
            <span class="role-chip">STUDENT</span>
          </div>

          <label class="field-label" for="reg-password">Password</label>
          <div class="field-wrap">
            <input class="field" type="password" id="reg-password" placeholder="At least 8 characters">
            <button type="button" class="show-btn" id="toggle-reg-pass">SHOW</button>
          </div>

          <label class="field-label" for="otp">Email OTP</label>
          <div class="otp-row">
            <input class="field" type="text" id="otp" placeholder="6-digit code" maxlength="6">
            <button type="button" class="btn-small" id="send-otp">SEND OTP</button>
          </div>
          <p class="hint" id="otp-hint"></p>

          <label class="field-label" for="reg-captcha">Captcha</label>
          <div class="captcha-row">
            <div class="captcha-box" id="reg-captcha-box">00000</div>
            <button type="button" class="link-btn" id="reg-new-captcha">&#8635; NEW</button>
          </div>
          <input class="field" type="text" id="reg-captcha" placeholder="Enter the code" maxlength="5">

          <label class="check-row">
            <input type="checkbox" id="age">
            <span>I confirm that I am 18 years or older.</span>
          </label>

          <p class="form-error" id="reg-error"></p>

          <button type="submit" class="btn-black">REGISTER <span>&#8599;</span></button>
          <a href="/login" class="forgot">ALREADY HAVE AN ACCOUNT? LOGIN</a>
        </form>
      </div>
    </section>

  </main>

  <script src="/js/register.js"></script>
</body>
</html>
