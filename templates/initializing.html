<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initializing | CampusCode</title>
  <link rel="icon" href="/img/campuscode-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="init-body">

  <header class="init-top">
    <div class="init-brand">
      <span class="logo-tile"><img src="/img/campuscode-logo.png" alt="CampusCode"></span>
      <div>
        <strong>CAMPUSCODE</strong>
        <span class="init-mono">HACKATHON ARENA</span>
      </div>
    </div>
    <span class="init-mono"><span class="dot"></span> SECURE CONNECTION</span>
  </header>

  <main class="init-center">
    <span class="logo-tile big"><img src="/img/campuscode-logo.png" alt="CampusCode"></span>
    <h1 class="init-title">CAMPUSCODE</h1>
    <p class="init-status">AUTHENTICATING SESSION.</p>

    <div class="init-progress-row">
      <span class="init-mono">SYSTEM INITIALIZATION</span>
      <span class="init-mono" id="percent">000%</span>
    </div>
    <div class="init-track"><div class="init-fill" id="fill"></div></div>

    <p class="init-access"><span class="init-mono">ACCESS LEVEL</span> <span class="init-pill">STUDENT</span></p>
  </main>

  <footer class="init-bottom">
    <span class="init-mono">CAMPUSCODE &copy; 2026</span>
    <span class="init-mono">AUTH / INITIALIZATION</span>
    <span class="init-mono"><span class="dot"></span> ALL SYSTEMS OPERATIONAL</span>
  </footer>

  <script src="/js/initializing.js"></script>
</body>
</html>
